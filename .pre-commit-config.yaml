repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2  # keep equal to the ruff pin in requirements-dev.txt (#520)
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        pass_filenames: false
        always_run: true
